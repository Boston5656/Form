<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6CF3E">
<title>Form Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#F6CF3E;--k:#141414;--k2:#242424;--k3:#2e2e2e;--sp:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Prompt,system-ui,sans-serif;background:linear-gradient(180deg,#FBDD5E,#F2C230) fixed;color:#fff;min-height:100vh;padding-top:env(safe-area-inset-top)}
.w{max-width:560px;margin:0 auto;padding:14px 14px 130px}
.tabs{display:flex;gap:4px;padding:6px;background:#fff6c4;border-radius:99px;box-shadow:0 4px 16px #0002;position:relative}
.tabs button{flex:1;border:0;background:none;font:600 14px Prompt;padding:11px;border-radius:99px;color:var(--k);z-index:1;cursor:pointer;transition:color .4s var(--sp)}
.tabs button.on{color:#fff}
#pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 20px)/3);background:var(--k);border-radius:99px;transition:transform .55s var(--sp)}
.hd{text-align:center;color:var(--k);margin:22px 0 4px}
.chip{display:inline-block;background:#fff6c4;font:700 11px Prompt;padding:6px 14px;border-radius:99px;box-shadow:0 2px 8px #0002}
.hd h1{font-size:28px;font-weight:800;margin:12px 0 4px}
.hd p{margin:0;font-size:13px;opacity:.7}
.pg{height:5px;background:#0002;border-radius:9px;margin:16px 6px 0;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--k);border-radius:9px;transition:width .7s var(--sp)}
.c{background:var(--k);border-radius:28px;padding:18px;margin-top:12px;box-shadow:0 10px 30px #0003;animation:up .8s var(--sp) both}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97)}}
.h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--y);color:var(--k);display:grid;place-items:center;font-size:13px;font-weight:800}
.b{margin-left:auto;flex:none;font-size:11px;color:var(--y);background:#f6cf3e26;padding:4px 10px;border-radius:99px;font-weight:500}
input,textarea{width:100%;margin-top:12px;background:var(--k2);border:1.5px solid transparent;color:#fff;border-radius:16px;padding:14px;font:16px Prompt;outline:0;resize:none;transition:border-color .3s,background .3s}
input:focus,textarea:focus{border-color:var(--y);background:var(--k3)}
input:focus-visible,button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
::placeholder{color:#777}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ch span{padding:10px 16px;border-radius:99px;background:var(--k2);font-size:14px;cursor:pointer;user-select:none;transition:background .35s var(--sp),color .35s,transform .35s var(--sp)}
.ch span:active{transform:scale(.92)}
.ch span.on{background:var(--y);color:var(--k);font-weight:600}
.up{margin-top:12px;border:2px dashed #555;border-radius:20px;padding:24px;text-align:center;color:#aaa;font-size:14px;cursor:pointer;transition:transform .4s var(--sp),border-color .3s}
.up:active{transform:scale(.97);border-color:var(--y)}
.up small{opacity:.6}
.th{display:flex;gap:10px;flex-wrap:wrap}
.th div{position:relative;width:78px;height:78px;margin-top:12px;border-radius:16px;background:var(--k2) center/cover;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--y);animation:up .5s var(--sp)}
.th i{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:#ef5545;color:#fff;font-style:normal;display:grid;place-items:center;font-size:11px;cursor:pointer}
.go{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(532px,calc(100% - 28px));border:0;background:var(--k);color:#fff;font:700 16px Prompt;padding:18px;border-radius:22px;box-shadow:0 10px 30px #0006;cursor:pointer;transition:transform .4s var(--sp),opacity .3s;z-index:3}
.go:active{transform:translateX(-50%) scale(.96)}
.go:disabled{opacity:.6}
.bt{width:100%;border:0;background:var(--y);color:var(--k);font:700 16px Prompt;padding:16px;border-radius:18px;margin-top:14px;cursor:pointer;transition:transform .4s var(--sp)}
.bt:active{transform:scale(.96)}
.bt.dl{background:var(--k2);color:#ef5545;margin-top:10px}
.ar{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.ar button{border:0;background:var(--k2);color:#fff;width:36px;height:32px;border-radius:10px;cursor:pointer}
.ar button:active{background:var(--y);color:var(--k)}
.ar span{margin-left:auto;opacity:.45}
.add{margin-top:12px;border:2px dashed #14141466;border-radius:24px;padding:18px;text-align:center;font-weight:700;color:var(--k);cursor:pointer;transition:transform .4s var(--sp)}
.add:active{transform:scale(.97)}
.rw{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;margin-top:8px;background:var(--k2);border-radius:14px;color:#fff;text-decoration:none;font-size:14px}
.rw small{opacity:.5}
#bd{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .45s;z-index:4}
#bd.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--k);border-radius:32px 32px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .65s var(--sp);z-index:5;max-height:90vh;overflow:auto}
#sh.on{transform:none}
#t{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140px);background:var(--k);color:#fff;padding:13px 22px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0
